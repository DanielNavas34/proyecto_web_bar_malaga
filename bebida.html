    <main>
        <h2>Una experiencia inmersiva.</h2>

    <div id="icono-carrito" onclick="toggleCarrito()">

        <div class="total-carrito">Total: <span id="total-precio">0.00</span>€</div>
        <button onclick="borrarCarrito()" style="background: red; color: white;">Vaciar</button>
        <button onclick="finalizarPedido()" style="background: green; color: white;">Pedir por WhatsApp</button>
